<svg viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#005a8d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004182;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7941d;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Icon Background Circle -->
  <circle cx="75" cy="75" r="60" fill="url(#primaryGradient)" filter="url(#shadow)"/>
  
  <!-- Main H structure with neural connections -->
  <g transform="translate(35, 35)">
    <!-- Left vertical bar of H -->
    <rect x="15" y="20" width="12" height="60" fill="white" rx="3"/>
    
    <!-- Right vertical bar of H -->
    <rect x="55" y="20" width="12" height="60" fill="white" rx="3"/>
    
    <!-- Horizontal bar of H -->
    <rect x="23" y="46" width="42" height="10" fill="white" rx="3"/>
    
    <!-- AI Neural Network Nodes (orange dots) -->
    <circle cx="21" cy="28" r="4" fill="url(#accentGradient)"/>
    <circle cx="61" cy="28" r="4" fill="url(#accentGradient)"/>
    <circle cx="41" cy="40" r="3" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="21" cy="72" r="4" fill="url(#accentGradient)"/>
    <circle cx="61" cy="72" r="4" fill="url(#accentGradient)"/>
    <circle cx="41" cy="60" r="3" fill="url(#accentGradient)" opacity="0.8"/>
    
    <!-- Neural connection lines -->
    <line x1="23" y1="30" x2="39" y2="40" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>
    <line x1="43" y1="40" x2="59" y2="30" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>
    <line x1="23" y1="70" x2="39" y2="60" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>
    <line x1="43" y1="60" x2="59" y2="70" stroke="url(#accentGradient)" stroke-width="2" opacity="0.5"/>
    <line x1="41" y1="43" x2="41" y2="57" stroke="url(#accentGradient)" stroke-width="2" opacity="0.4"/>
  </g>
  
  <!-- Text: HermesAI -->
  <text x="160" y="65" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="url(#primaryGradient)">
    Hermes
  </text>
  <text x="315" y="65" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="url(#accentGradient)">
    AI
  </text>
  
  <!-- Subtitle: Solutions -->
  <text x="160" y="95" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Solutions
  </text>

  <!-- Tagline -->
  <text x="160" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#64748b">
    40+ Years Financial Technology Leadership
  </text>
  
  <!-- Accent underline -->
  <rect x="160" y="125" width="260" height="3" fill="url(#accentGradient)" opacity="0.6" rx="1.5"/>
  
  <!-- Small decorative tech elements -->
  <circle cx="430" cy="50" r="3" fill="url(#accentGradient)" opacity="0.4"/>
  <circle cx="445" cy="58" r="2" fill="url(#primaryGradient)" opacity="0.3"/>
  <circle cx="460" cy="53" r="2.5" fill="url(#accentGradient)" opacity="0.5"/>
</svg>